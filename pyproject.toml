[project]
name = "glacier-buffer-replacement-utac"
version = "1.1.0"
description = "Artificial Glacier Buffer Replacement (AGBR) science -- proglacial reservoirs, MAR, floating solar, real mass-balance ceiling (Farinotti et al. 2016), plus a clearly-flagged speculative RRF/scenario layer -- no UTAC/CREP bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/GenesisAeon/glacier-buffer-replacement-utac"
Repository = "https://github.com/GenesisAeon/glacier-buffer-replacement-utac"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glacier_buffer_replacement_utac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=glacier_buffer_replacement_utac --cov-report=term-missing -v"
